# Independent QA of a PR or its current head: exercise the change, verify the fix, post a
# verdict. Read-only like code-review: no setup, no gates, no commits. The verdict is posted with
# `gh` as a PR comment headed "## QA", never written into the tree. There is no readiness step, so
# `branch.owned-by-run` never applies to this role — reviewing another PR means checking its head
# out, which detaches HEAD, and a verdict-only role must never reach the check that refuses that
# (#356: independent QA always ended `failed` when it ran on `testing-and-verification` instead).
name: qa
description: "Independent QA of a PR or its current head: exercise the change, verify the fix, post a ## QA verdict comment and apply the SDLC QA-gate labels. Read-only."
steps:
  - id: kit
    name: Snapshot the local project kit
    command: 'bash "$(git rev-parse --path-format=absolute --git-common-dir)/../.xezar/checks/bootstrap.sh"'
    resultScope: routine
  - id: preflight
    name: Report the checkout
    command: ".xezar/checks/worktree-preflight.sh --allow-root"
    resultScope: routine
  - id: review
    name: QA
    prompt: "QA (see your skill for what to post and which labels to apply): {{task}}"
    skill: xezar-qa
    verdictRole: qa
    allowedTools: [Read, Grep, Glob, Bash]
    bashAllowlist: ["git rev-parse", "git cat-file", "git merge-base", "git status", "git branch --show-current", "git ls-files", "git ls-tree", "git rev-list", "git blame", "gh pr view", "gh pr diff", "gh pr checks", "gh pr comment", "gh pr edit", "gh issue view", "gh run view", "gh issue create", "bash .xezar/checks/bootstrap.sh", "bash .xezar/checks/worktree-setup.sh", "bash .xezar/checks/worktree-preflight.sh", "bash .xezar/checks/phase-record.sh", "bash .xezar/checks/security-scan.sh", "bash .xezar/checks/verify-evidence.sh", "node .xezar/checks/catalog-check.mjs", "node .xezar/checks/xezar-contract.test.mjs", "bash .xezar/checks/verdict-packet.sh", "node .xezar/checks/lib/project-policy.mjs", "git checkout --detach", "npm ci", "npm run build", "npm run test:e2e", "npm test", "sh scripts/test-env-up.sh", "sh scripts/test-env-down.sh", "bash scripts/test-env-up.sh", "bash scripts/test-env-down.sh", agent-browser, "npm run typecheck", "npm run test:unit", "sh scripts/e2e.sh", "bash scripts/e2e.sh", pwd, ls, cat, echo, printf, grep, jq, wc, head, tail, diff, sha256sum, shasum]
