# LAUNCH THIS WITH WORKTREE **ON** (the composer default). The changelog is written and committed
# on this task's own `xez/<id8>` branch and reaches `main` only through a pull request; the
# primary checkout is never touched. Bringing the primary checkout up to the bump merge commit
# afterwards is the separate `root-sync` workflow (Worktree OFF), by design — a root write cannot
# share a run with a worktree write.
#
# EVERY WAIT LIVES IN THE LAST STEP. The engine kills any agent step that is not the last step of
# its workflow at its configured timeout (default 30 minutes, issue #22). CI on the changelog PR, the Release run, npm and the
# bot's bump PR together take longer than that, so the publish step (`handoff`) is the final
# agent step: it is the only step that may block on remote state, and being last also keeps
# XEZ:ASK live for every stop.
#
# `{{task}}` is the operator's one-line brief: `bump: patch` (or `minor` / `major`), optionally
# `version: 0.11.2` and `dry-run: true`. No changelog brief: the `changelog` step derives the entry
# from the PRs merged into main since the last release tag (see skills/xezar-release-changelog.md).
name: release
description: Write the changelog from merged PRs, gate it, merge the changelog PR, dispatch the manually authorized Release workflow and merge the bump PR — one task per release. Worktree ON.
steps:
  - id: kit
    name: Snapshot the local project kit
    command: 'bash "$(git rev-parse --path-format=absolute --git-common-dir)/../.xezar/checks/bootstrap.sh"'
  - id: preflight
    name: Verify worktree isolation
    command: ".xezar/checks/worktree-preflight.sh"
  - id: setup
    name: Prepare the worktree
    command: ".xezar/checks/worktree-setup.sh"
  # THE MCP MUTATION GATE IS NOT HERE ANY MORE (#377). It used to run first, as a check step,
  # before anything was authored. It now runs on a SCHEDULE against `main` —
  # `.github/workflows/mutation.yml`, weekly — and the reasoning that moved it is the reasoning
  # that put it here in the first place, turned around:
  #
  #   - It tests the code being released, which the changelog step does not touch. True, and it
  #     is exactly why it does not need to be in the release path: the revision it measures is
  #     already on `main` and already measured there.
  #   - A failure "is fixed by tests in their own PR, never by retrying the changelog". Also
  #     true — and a gate whose only repair lives outside the task holding it is a gate in the
  #     wrong place. The authors who could act finished hours earlier.
  #   - A full run is hours of CPU, so it was never a per-PR check. That made release time its
  #     FIRST end-to-end exercise, which is when failure costs most: the 0.14.0 attempt died in
  #     Stryker's dry run on a config mismatch (#375) — a lost release run, a fix PR, a review
  #     and a relaunch, and zero product defects found.
  #   - A surviving mutant means a test is weak. That is next week's work, not a reason to hold
  #     code that already passed the full canonical gate and independent QA on every PR. And a
  #     check step is binary: "is this survivor already tracked in #338 / #353, or is it new?"
  #     is not a question an exit code can answer.
  #
  # The gate itself is unchanged — same scope, same `thresholds.break` of 80
  # (packages/xezar/stryker.config.mjs), see docs/testing/coverage-gaps.md § 10.8. What protects
  # it between scheduled runs is the cheap per-PR test #375 added,
  # packages/xezar/src/mutation-name-filter.test.ts.
  - id: changelog
    name: Write the changelog entry from merged PRs
    prompt: "{{task}}"
    skill: xezar-release-changelog
  - id: readiness
    name: Confirm the task is not blocked
    command: ".xezar/checks/worktree-preflight.sh --readiness"
  - id: gates
    name: Quality gates
    command: ".xezar/checks/repo-gates.sh --fast"
    onFail:
      retry: changelog
      max: 2
  - id: evidence
    name: Seal the gate evidence
    command: ".xezar/checks/worktree-preflight.sh --record-gate-evidence"
  # The id is `handoff`, not `publish`: catalog-check.mjs' writing-workflow phase contract (#116)
  # requires that id after `evidence`, and this step IS the handoff — it pushes the branch and
  # opens the changelog PR — before it goes on to dispatch and merge.
  - id: handoff
    name: Publish — merge the changelog, dispatch Release, merge the bump PR
    prompt: "Publish the release for: {{task}}"
    skill: xezar-release-publish
