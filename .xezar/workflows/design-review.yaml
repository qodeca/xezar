# Reviews a designs/<feature>/ folder or a PR's cockpit UI against docs/design-system/.
# Read-only like code-review: no setup, no gates, no commits. The verdict is posted with
# `gh` as a PR comment headed "## Design review", never written into the tree. There is
# no readiness step, so `branch.has-own-commits` never applies to this role.
name: design-review
description: "Review a designs/<feature>/ mockup or a PR's cockpit UI against the design system and the accessibility bar. Verdict PASS / PASS WITH FOLLOW-UPS / FAIL. Read-only."
steps:
  - id: kit
    name: Snapshot the local project kit
    command: 'bash "$(git rev-parse --path-format=absolute --git-common-dir)/../.xezar/checks/bootstrap.sh"'
    resultScope: routine
  - id: preflight
    name: Report the checkout
    command: ".xezar/checks/worktree-preflight.sh --allow-root"
    resultScope: routine
  - id: review
    name: Design review
    prompt: "Design review (see '## Review mode' in your skill): {{task}}. Follow docs/design-system/README.md through usage, recipes, verification, lifecycle and storage. Own only the read-only verdict and review evidence at the identified revision; the author owns mockup, README handoff and index updates. Preserve label authority and report unavailable checks honestly."
    skill: xezar-ux-design
    verdictRole: design-review
    allowedTools: [Read, Grep, Glob, Bash]
    bashAllowlist: ["git log", "git diff", "git show", "git rev-parse", "git cat-file", "git merge-base", "git status", "git fetch", "git branch --show-current", "git ls-files", "git ls-tree", "git rev-list", "git blame", "gh pr view", "gh pr diff", "gh pr checks", "gh pr comment", "gh pr edit", "gh issue view", "gh run view", "bash .xezar/checks/bootstrap.sh", "bash .xezar/checks/worktree-setup.sh", "bash .xezar/checks/worktree-preflight.sh", "bash .xezar/checks/phase-record.sh", "bash .xezar/checks/security-scan.sh", "bash .xezar/checks/verify-evidence.sh", "node .xezar/checks/catalog-check.mjs", "node .xezar/checks/xezar-contract.test.mjs", "bash .xezar/checks/verdict-packet.sh", "git checkout --detach", "npm ci", "npm run build", "npm run test:e2e", "npm test", "sh scripts/test-env-up.sh", "sh scripts/test-env-down.sh", "bash scripts/test-env-up.sh", "bash scripts/test-env-down.sh", agent-browser, pwd, ls, cat, echo, printf, grep, jq, wc, head, tail, find, diff, sha256sum, shasum]
