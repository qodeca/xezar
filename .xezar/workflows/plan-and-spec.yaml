name: plan-and-spec
description: Design an approach and write a right-sized spec under docs/features/ before substantial work.
steps:
  - id: kit
    name: Snapshot the local project kit
    command: 'bash "$(git rev-parse --path-format=absolute --git-common-dir)/../.xezar/checks/bootstrap.sh"'
  - id: preflight
    name: Verify worktree isolation
    command: ".xezar/checks/worktree-preflight.sh"
  - id: setup
    name: Prepare the worktree
    command: ".xezar/checks/worktree-setup.sh"
  - id: plan
    name: Design and specify
    prompt: "{{task}}"
    skill: xezar-planning-spec
    timeout: 2h
  - id: readiness
    name: Confirm the task is not blocked
    command: ".xezar/checks/worktree-preflight.sh --readiness"
  - id: gates
    name: Quality gates
    command: ".xezar/checks/repo-gates.sh --fast"
    onFail:
      retry: plan
      max: 2
  - id: evidence
    name: Seal the gate evidence
    command: ".xezar/checks/worktree-preflight.sh --record-gate-evidence"
  - id: handoff
    name: Draft PR into main
    prompt: "Hand off the spec and plan produced for: {{task}}"
    skill: xezar-handoff-draft-pr
