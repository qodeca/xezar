name: code-review
description: Review a PR or the current branch diff against this repo's architecture and conventions. Read-only.
steps:
  - id: kit
    name: Snapshot the local project kit
    command: 'bash "$(git rev-parse --path-format=absolute --git-common-dir)/../.xezar/checks/bootstrap.sh"'
    resultScope: routine
  - id: preflight
    name: Report the checkout
    command: ".xezar/checks/worktree-preflight.sh --allow-root"
    resultScope: routine
  - id: review
    name: Review
    prompt: "{{task}}"
    skill: xezar-code-review
    verdictRole: code-review
    allowedTools: [Read, Grep, Glob, Bash]
    bashAllowlist: ["git log", "git diff", "git show", "git rev-parse", "git cat-file", "git merge-base", "git status", "git fetch", "git branch --show-current", "git ls-files", "git ls-tree", "git rev-list", "git blame", "gh pr view", "gh pr diff", "gh pr checks", "gh pr comment", "gh pr edit", "gh issue view", "gh run view", "bash .xezar/checks/bootstrap.sh", "bash .xezar/checks/worktree-setup.sh", "bash .xezar/checks/worktree-preflight.sh", "bash .xezar/checks/phase-record.sh", "bash .xezar/checks/security-scan.sh", "bash .xezar/checks/verify-evidence.sh", "node .xezar/checks/catalog-check.mjs", "node .xezar/checks/xezar-contract.test.mjs", "bash .xezar/checks/verdict-packet.sh", pwd, ls, cat, echo, printf, grep, jq, wc, head, tail, find, diff, sha256sum, shasum]
