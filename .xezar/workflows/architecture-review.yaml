# Reviews the DESIGN of a PR or branch diff: boundaries, coupling, contract shape and whether a
# replaced mechanism kept its guarantees. Read-only like code-review: no setup, no gates, no
# commits. The verdict is posted with `gh` as a PR comment headed "## Architecture review", never
# written into the tree, and it never moves `merge-queue` (that stays with code-review). There is no
# readiness step, so `branch.owned-by-run` never applies to this role (#356). `verdictRole` is what
# lets the engine record this step's packet at all (#851); without it the packet is refused.
name: architecture-review
description: "Review the design of a PR or branch diff: boundaries, coupling, contract shape and replaced mechanisms. Verdict APPROVE / REQUEST CHANGES as a ## Architecture review comment. Read-only."
steps:
  - id: kit
    name: Snapshot the local project kit
    command: 'bash "$(git rev-parse --path-format=absolute --git-common-dir)/../.xezar/checks/bootstrap.sh"'
    resultScope: routine
  - id: preflight
    name: Report the checkout
    command: ".xezar/checks/worktree-preflight.sh --allow-root"
    resultScope: routine
  - id: git-read-acquire
    name: Acquire git reads
    command: "bash .xezar/checks/git-read-acquire.sh"
    resultScope: routine
  - id: review
    name: Architecture review
    prompt: "{{task}}"
    skill: xezar-architecture-review
    verdictRole: architecture-review
    allowedTools: [Read, Grep, Glob, Bash]
    bashAllowlist: ["bash .xezar/checks/git-read.sh", "git log", "git diff", "git show", "git rev-parse", "git cat-file", "git merge-base", "git status", "git fetch", "git branch --show-current", "git ls-files", "git ls-tree", "git rev-list", "git blame", "gh pr view", "gh pr diff", "gh pr checks", "gh pr comment", "gh pr edit", "gh issue view", "gh run view", "bash .xezar/checks/bootstrap.sh", "bash .xezar/checks/worktree-setup.sh", "bash .xezar/checks/worktree-preflight.sh", "bash .xezar/checks/phase-record.sh", "bash .xezar/checks/security-scan.sh", "bash .xezar/checks/verify-evidence.sh", "node .xezar/checks/catalog-check.mjs", "node .xezar/checks/xezar-contract.test.mjs", "bash .xezar/checks/verdict-packet.sh", pwd, ls, cat, echo, printf, grep, jq, wc, head, tail, find, diff, sha256sum, shasum]
