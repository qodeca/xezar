name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Read-only, and no npm credential anywhere in this file. Ordinary PR CI verifies; it never
# publishes. The only thing in this repository that reaches the registry is the manually
# dispatched `Release` workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, build, E2E, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `lts/*` — the current Node LTS, whatever it is on the day the job runs, so
      # the gate follows the release line users actually install on instead of
      # freezing on a version that quietly ages out of support. The floor stays the
      # root manifest's `engines.node`; this is the ceiling we verify against.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The documented validation gate, in the documented order (SDLC.md,
      # .ai/agentic.config.json → validation.commands).
      - name: Typecheck
        run: npm run typecheck

      - name: Run server and cockpit unit suites
        run: npm test

      - name: Run unit tests
        run: npm run test:unit

      - name: Build application
        run: npm run build

      - name: Run packaged CLI E2E tests
        run: npm run test:package

      # The one package the release publishes must be packable. The workspace root is
      # `private` and publishes nothing, so packing THERE just errors ("must have name and
      # version"). Named explicitly rather than with `--workspaces`, which would also pack the
      # private packages (the contract, the api-client, the cockpit SPA) and vouch for tarballs
      # nobody publishes.
      - name: Verify the release package packs
        run: npm pack --dry-run --ignore-scripts -w @qodeca/xezar
