name: Release

# The ONLY workflow in this repository that publishes to npm, and the only one that can create
# a release tag. It is `workflow_dispatch`-only and never fires from a push (#482): nothing
# reaches the registry unless a maintainer asks for it by name and picks the bump.
#
# There is NO npm token anywhere in this repository. Publishing authenticates with npm TRUSTED
# PUBLISHING (OIDC): GitHub mints a short-lived identity token for this job, and npm checks it
# against the trusted publisher configured on the package — which names this repository AND this
# workflow file by name. Renaming this file, or copying the publish step into another workflow,
# breaks the publish rather than silently succeeding from somewhere unexpected. The one-time
# setup is in docs/publishing.md.
#
# TWO JOBS, so the publish rights never meet third-party code. `build` installs dependencies, runs
# the gate, builds, verifies the packaged CLI and packs the release tarball, with read-only
# permissions. `publish` (environment `production`, the only job with `id-token: write`) installs
# nothing and runs no package script: it downloads that tarball, checks its SHA-256 against the one
# `build` recorded, and publishes exactly those bytes with provenance. Then it tags the released
# commit and creates the GitHub Release, and only after that opens the version-bump PR, so a failed
# bump PR can never leave a published version with no tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (`existing` publishes the version already in packages/xezar/package.json)'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - existing

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and pack ${{ inputs.bump }} release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Releases from `main` (released work only; `develop` is the base) or a `release/*` maintenance branch — the latter
    # is how a patch line (e.g. `release/0.10.x`) ships fixes without the newer features already
    # merged to `main`. Dispatch from the BRANCH, never a tag: workflow_dispatch reads this file
    # from the ref it runs on, and a tag's copy is frozen, so a tag would still evaluate the old
    # gate.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    # Read-only: this job runs `npm ci` and every package script, so it holds no publish right.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
      root-name: ${{ steps.pack.outputs.rootName }}
      tarballs: ${{ steps.pack.outputs.tarballs }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same validation gate CI runs, on the exact revision being released — a green PR run
      # is not a promise about the merge commit a release is cut from.
      - name: Verify before release
        run: |
          npm run typecheck
          npm test
          npm run test:unit

      - name: Build application
        run: npm run build

      # Packaging/install verification BEFORE anything is packed for publishing: this packs the
      # real tarball, installs it into an isolated consumer and runs the CLI out of it. A tarball
      # that cannot be installed must never reach the registry, where the version is immutable.
      - name: Verify the packaged CLI installs and runs
        run: npm run test:package

      # Stamps every release manifest to the new version and packs each publishable package
      # (`npm pack --ignore-scripts`, the file set `npm publish` sends). Publishes nothing.
      - name: Stamp and pack the release tarball
        id: pack
        env:
          BUMP: ${{ inputs.bump }}
          PACK_DIR: ${{ runner.temp }}/release-package
        run: |
          node scripts/release.mjs "$BUMP" --pack-destination "$PACK_DIR"
          mkdir -p "$PACK_DIR/manifests"
          for dir in contract api-client web xezar; do
            mkdir -p "$PACK_DIR/manifests/packages/$dir"
            cp "packages/$dir/package.json" "$PACK_DIR/manifests/packages/$dir/package.json"
          done
          # GNU/BSD `sha256sum`, or `shasum -a 256` on an image without it: same file format.
          sums() { if command -v sha256sum >/dev/null 2>&1 && sha256sum --version >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          (cd "$PACK_DIR" && sums -- *.tgz > SHA256SUMS && cat SHA256SUMS)

      # The tarball, its checksum and the four stamped manifests (the bump PR commits those).
      - name: Upload the release tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.build.outputs.version }} to npm (latest)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    # Gate the publish behind a required-reviewer approval. If the environment isn't configured
    # yet, GitHub creates it on first use without reviewers (non-blocking); add reviewers at
    # Settings → Environments → production. npm's trusted publisher names this environment.
    environment: production
    permissions:
      contents: write # create the release tag + GitHub Release via the API
      id-token: write # mint the OIDC token npm trusted publishing authenticates with
      pull-requests: write # open the version-bump PR for patch/minor/major releases

    steps:
      # Needed only for the version-bump PR (a branch push). No dependency install follows.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trusted publishing needs npm 11.5.1+ for the OIDC exchange; `lts/*` ships well past
      # that, and `registry-url` is what writes the .npmrc npm reads the registry from. No
      # `cache:` — this job installs nothing.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Show npm version (trusted publishing needs >= 11.5.1)
        run: npm --version

      - name: Download the release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package

      # Publish exactly the bytes `build` packed and checked: the checksum is re-verified here,
      # and each tarball goes out in dependency order. `--ignore-scripts`: nothing runs from the
      # package. A failed `npm publish` fails the job, so a green step means it is on the registry.
      # No `env:` credential: the OIDC token is minted from the job's `id-token: write`.
      - name: Publish release
        id: publish
        env:
          PACK_DIR: ${{ runner.temp }}/release-package
          TARBALLS: ${{ needs.build.outputs.tarballs }}
        run: |
          set -euo pipefail
          cd "$PACK_DIR"
          sums() { if command -v sha256sum >/dev/null 2>&1 && sha256sum --version >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          sums --check --strict SHA256SUMS
          [ -n "$TARBALLS" ] || { echo "::error title=Nothing to publish::the build job packed no tarball"; exit 1; }
          for tarball in $TARBALLS; do
            npm publish "./$tarball" --tag latest --access public --ignore-scripts --provenance
          done
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Right after the publish and BEFORE the bump PR: the tag points at the exact commit the
      # tarball was built from, so the release source and the npm artifact can never disagree
      # about which revision shipped, and a later failure cannot leave a version with no tag.
      - name: Create GitHub Release
        id: github-release
        if: steps.publish.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ROOT_NAME: ${{ needs.build.outputs.root-name }}
        with:
          script: |
            const version = process.env.VERSION;
            const pkg = process.env.ROOT_NAME;
            const body = [
              '## Published package',
              '',
              '| Package | Version | Dist-tag |',
              '|---|---|---|',
              `| \`${pkg}\` | \`${version}\` | \`latest\` |`,
              '',
              '### Install',
              '',
              '```bash',
              `npm install -g ${pkg}@${version}`,
              'xezar --version',
              'xezar serve',
              '```',
              '',
              '### Or run it without installing',
              '',
              '```bash',
              `npx ${pkg}@${version}`,
              '```',
              '',
              `Built from \`${context.sha}\`.`,
            ].join('\n');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              target_commitish: context.sha,
              name: `v${version}`,
              body,
              draft: false,
              prerelease: false,
            });

      # `main` is PR-only, so a release never pushes a commit to it directly.
      #   - `existing` (the version is already on main via its own PR) records nothing new here;
      #     the tag + Release above capture the release point.
      #   - patch/minor/major bump the manifests to a version that is NOT yet on main, so they
      #     open a follow-up PR with the bump instead of pushing. It runs after a published
      #     release even when the GitHub Release step failed: each is recoverable on its own.
      - name: Open version-bump PR (patch/minor/major only)
        id: bump-pr
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && inputs.bump != 'existing' }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BASE_BRANCH: ${{ github.ref_name }}
          PACK_DIR: ${{ runner.temp }}/release-package
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          cp -R "$PACK_DIR/manifests/packages/." packages/
          git add packages/contract/package.json packages/api-client/package.json packages/web/package.json packages/xezar/package.json
          git commit -m "chore(release): v${VERSION}"
          git push origin "$BRANCH"
          gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "chore(release): v${VERSION}" \
            --body "Record the \`v${VERSION}\` version bump that the Release workflow published to npm \`latest\`. Merge to keep \`${BASE_BRANCH}\`'s manifests in sync with the published version."

      # Every line reports what its own step actually did, never what the run hoped for.
      - name: Write workflow summary
        if: always()
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ROOT_NAME: ${{ needs.build.outputs.root-name }}
          BUMP: ${{ inputs.bump }}
          PUBLISH: ${{ steps.publish.outcome }}
          GITHUB_RELEASE: ${{ steps.github-release.outcome }}
          BUMP_PR: ${{ steps.bump-pr.outcome }}
        run: |
          {
            echo "## Release ${VERSION}"
            echo ""
            if [ "$PUBLISH" = "success" ]; then
              echo "- npm: published \`${ROOT_NAME}@${VERSION}\` to \`latest\`."
            else
              echo "- npm: ⚠️ NOT published (publish step: ${PUBLISH:-not run})."
            fi
            if [ "$GITHUB_RELEASE" = "success" ]; then
              echo "- Tag and GitHub Release: created \`v${VERSION}\`."
            else
              echo "- Tag and GitHub Release: ⚠️ not created (step: ${GITHUB_RELEASE:-not run}). If npm was published, create it by hand (docs/publishing.md § Recovering from a partial failure)."
            fi
            if [ "$BUMP" = "existing" ]; then
              echo "- Version-bump PR: not needed (bump \`existing\`)."
            elif [ "$BUMP_PR" = "success" ]; then
              echo "- Version-bump PR: opened from \`release/v${VERSION}\`."
            else
              echo "- Version-bump PR: ⚠️ not opened (step: ${BUMP_PR:-not run}). Open it by hand (docs/publishing.md § Recovering from a partial failure)."
            fi
            if [ "$PUBLISH" = "success" ]; then
              echo ""
              echo '```bash'
              echo "npm install -g ${ROOT_NAME}@${VERSION}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
