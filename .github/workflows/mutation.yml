name: MCP mutation gate

# The MCP mutation gate, on a schedule instead of in the release path (#377).
#
# WHERE IT USED TO BE. `.xezar/workflows/release.yaml` ran `npm run test:mutation:mcp` as its
# first check step, so a finished, approved release waited on a 3 h 40 min measurement whose
# only repair — a stronger test — lives in somebody else's pull request. The 0.14.0 attempt died
# in Stryker's dry run on a config mismatch (#375) and found zero product defects. The gate was
# not wrong; its position was.
#
# CADENCE — WEEKLY, AND WHY NOT NIGHTLY.
#   - This repository is PUBLIC, so standard GitHub-hosted runners cost nothing. The cost that
#     is real is wall clock and attention, not money: nightly would produce ~30 reports a month
#     against a score that moves when somebody changes `packages/xezar/src/mcp/**` or the suites
#     that kill its mutants, which is not most nights.
#   - Weekly is ~4 runs a month, ~60 runner-hours (6 shards x ~2.5 h), £0 on a public repo.
#     Nightly would be ~450 runner-hours for the same information.
#   - A change-triggered run (only when the MCP scope moved since the last run) was considered
#     and rejected: the saving is free minutes, and its failure mode — a `git diff` against a
#     stale or force-pushed SHA that decides "nothing changed" for ever — is exactly the
#     "scheduled job nobody reads" outcome this workflow exists to prevent. `workflow_dispatch`
#     covers the impatient case with none of that risk.
#
# WHY SIX JOBS AND NOT ONE. A GitHub job is killed at 6 hours. The measured full run is
# 3 h 40 min on an 18-core laptop at Stryker concurrency 4; `ubuntu-latest` has 4 cores, so
# `stryker.config.mjs` resolves concurrency to 3 there, on slower cores. One job would not
# finish. `scripts/mutation-shards.mjs` splits the scope into six disjoint slices and
# `scripts/mutation-aggregate.mjs` puts the summed counts through Stryker's own formula, so the
# number this workflow enforces is the whole-scope score and the floor is still the 80 in
# `packages/xezar/stryker.config.mjs`. Nothing about the gate is narrower than it was.
#
# HOW A FAILURE REACHES SOMEBODY. Three ways, because a scheduled check nobody reads is the
# other way this goes wrong: the run itself goes red; the `report` job writes the score table
# into the run summary; and it opens (or comments on) a tracking issue, and closes that issue
# again on the next green run.

on:
  schedule:
    # 03:17 UTC on Sundays. Off-peak, and a weekly result is ready before Monday.
    - cron: '17 3 * * 0'
  workflow_dispatch:

# Read-only by default. Only the `report` job asks for `issues: write`, and it is the one job
# that runs no repository code beyond two Node scripts with no dependencies.
permissions:
  contents: read

concurrency:
  # Never two of these at once on one ref — six runners each is enough. Queue rather than
  # cancel: a run cancelled at hour two has measured nothing anybody can read.
  group: mcp-mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Needs no `npm ci`: the planner imports `stryker.config.mjs` (whose only import is `node:os`)
  # and walks the scope with `node:fs`.
  plan:
    name: Plan the shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Split the MCP mutation scope
        id: plan
        run: |
          set -euo pipefail
          node scripts/mutation-shards.mjs
          echo "matrix=$(node scripts/mutation-shards.mjs --matrix)" >> "$GITHUB_OUTPUT"

  mutants:
    name: Mutants ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    # Five hours, under GitHub's 6-hour hard kill. A ceiling, not a target: the estimate for a
    # sixth of the scope is ~2.5 h, so a shard that reaches this is a regression worth failing
    # on — and it fails loudly, because the missing report fails the aggregate below.
    timeout-minutes: 300
    strategy:
      # Every shard runs. Stopping the others on one failure would leave the aggregate unable to
      # say whether the whole scope is above the floor, which is the only question asked here.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The file list goes through the environment, never interpolated into the command line.
      # `${{ }}` inside `run:` is textual substitution, and a path is repository content.
      - name: Run Stryker over this slice
        env:
          SHARD_MUTATE: ${{ matrix.mutate }}
        run: npm run test:mutation:mcp:shard -- --mutate "$SHARD_MUTATE"

      # `always()`: a shard that broke below its own (disabled) floor cannot happen, but a shard
      # that crashed after writing a partial report still tells the aggregate something, and a
      # shard that wrote nothing must reach the aggregate as a MISSING report rather than as a
      # job somebody has to remember to look at.
      - name: Upload this shard's report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ matrix.shard }}
          path: .local/mutation/mcp/
          # LOAD-BEARING. Stryker writes its reports under `.local/`, and this action skips
          # every path inside a dot-directory unless told not to. Without this line the
          # artifact uploads empty and the aggregate reports six missing shards.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Score and report
    needs: [plan, mutants]
    # `always()` so a failed or timed-out shard still lands here: the aggregate treats a missing
    # report as a failure, which is what turns a broken shard into a visible red gate instead of
    # a quietly smaller measurement.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Download every shard's report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-report-*
          path: .local/mutation/shards

      - name: Sum the shards and apply the floor
        id: aggregate
        # The step is allowed to fail so the reporting steps below still run; the LAST step in
        # this job turns that failure back into a red check.
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p .local/mutation
          node scripts/mutation-aggregate.mjs --reports .local/mutation/shards --out .local/mutation/summary.md
          status=$?
          # The aggregate writes the summary for both verdicts. It only misses it if the script
          # itself threw, which is a failure that must still say something readable.
          if [ ! -s .local/mutation/summary.md ]; then
            printf '## MCP mutation gate — FAILED\n\nThe aggregate did not produce a report. See the step log.\n' \
              > .local/mutation/summary.md
          fi
          cat .local/mutation/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # One tracking issue, reused. A new issue every week would be the same noise as no issue.
      - name: File or update the tracking issue
        if: steps.aggregate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'The MCP mutation gate is below its floor on main'
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file .local/mutation/summary.md
            echo "Commented on #$existing"
          else
            gh issue create --title "$TITLE" --body-file .local/mutation/summary.md --label testing
          fi

      - name: Close the tracking issue now the gate is green
        if: steps.aggregate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'The MCP mutation gate is below its floor on main'
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The scheduled run is back above the floor — see the run summary."
          fi

      # The last word on the job's own status, so a below-floor score is a RED scheduled check
      # and not just an issue somebody may or may not see.
      - name: Fail the gate when the score is below its floor
        if: steps.aggregate.outcome == 'failure'
        run: |
          echo "::error title=MCP mutation gate::the whole-scope mutation score is below the floor in packages/xezar/stryker.config.mjs — see the run summary"
          exit 1
