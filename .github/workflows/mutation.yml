name: MCP mutation gate

# The MCP mutation gate (`npm run test:mutation:mcp`), run nightly against `main` (#377).
#
# WHERE IT USED TO BE. `.xezar/workflows/release.yaml` ran it as its first check step until
# 2026-09-12, so a finished, approved release waited on a nearly four-hour measurement whose only
# repair — a stronger test — lives in somebody else's pull request (#375). #378 took it out of the
# release path, and from then until this file it ran nowhere automatically. It stays out of the
# release path, and out of pull requests: nightly, and not more often, is the owner's decision.
#
# WHAT THIS FILE MUST NEVER GROW. No `push` or `pull_request` trigger, and no publish power: no
# OIDC permission, no registry credential, no publish command.
# `packages/xezar/src/release/publishing-surface.test.ts` and
# `packages/xezar/src/mutation-workflow.test.ts` fail if either appears.
#
# WHY NINE JOBS AND NOT ONE. A GitHub-hosted job is killed at 6 hours. The measured full run is
# 3 h 40 min on an 18-core laptop at Stryker concurrency 4; `ubuntu-latest` in a public repository
# has 4 cores, so `stryker.config.mjs` resolves concurrency to 3 there, on slower cores, over a
# scope that has grown since. One job would not finish. `packages/xezar/mutation/shards.mjs` splits
# the scope into disjoint slices, each slice runs with `thresholds.break: null`, and
# `packages/xezar/mutation/aggregate.mjs` puts the summed counts through Stryker's own formula and
# applies the floor it reads from `packages/xezar/stryker.config.mjs` ONCE, to the whole scope. That
# config is the only place the floor is written. Nothing about the gate is narrower than it was.
#
# WHY NINE, AND WHY BALANCED ON MEASURED COST (#443, 2026-09-17, two rounds). Six shards, balanced
# on byte size, is what shipped first — and run 35175010173 (on `fdd5b4e`) showed byte size no
# longer predicts cost: PRs #533/#539/#541/#542 added broad tests that each exercise several MCP
# modules together, and under `coverageAnalysis: 'perTest'` that inflated the number of tests
# Stryker reruns per mutant 2-6x across nearly the whole scope, unevenly. Two shards passed 4 hours
# and a third (`bridge.ts`, `tools/task-create.ts` and others) was still running when the
# 300-minute ceiling cancelled it. The first fix moved to eight shards balanced on the measured cost
# in the committed `docs/testing/mcp-mutation-shard-weights.json`, falling back to byte size for a
# file it has never seen — but that fix's own proof run (35199363744) showed two of the seven
# carried-over `estimatedPaths` files (`bridge.ts`, `tools/task-create.ts`) were STILL badly
# under-counted: one shard ran 4h54m, the other was still running at the 300-minute ceiling. The
# second fix raises those two files' weights (back-calculated from that run's own per-shard wall
# clock, since neither shard produced a report to sum a real cost from) high enough that the same
# heaviest-first packing that already isolates `event-controller.ts` now isolates them too, and adds
# a ninth shard for headroom. Both this job's `plan` step and the `report` job's re-derived plan
# read the same committed file, so the two stay in lockstep with no new workflow permission or
# artifact. See `docs/testing/coverage-gaps.md` § 10.8 for the measurement.
#
# HOW A RESULT REACHES SOMEBODY. The run goes red; the `report` job writes the score table into the
# run summary; and on `main` it files, comments on or reopens ONE tracking issue (label
# `mutation-nightly`), and closes it again on the next green night
# (`packages/xezar/mutation/tracking-issue.mjs`). A planner failure takes the same path, so a gate
# that could not even start is not a silent one.
#
# NEW, ALREADY SEEN, KNOWN (#377, PR 2). The report also sorts the survivors
# (`packages/xezar/mutation/survivors.mjs`): KNOWN if the committed starting list
# `docs/testing/mcp-mutation-survivors.json` has them (with their #338 / #353 tag), ALREADY SEEN if
# the previous complete `main` run had them, NEW otherwise. A green night with new survivors stays
# green, and the tracking issue gets one comment listing them. One run posts at most one comment.
#
# FORCING THE RED PATH. Dispatch with `force_red: true` and no shard runs: the report job writes a
# "forced" summary, takes the red path to the tracking issue and fails. It is how the red path is
# proven on demand, in minutes, without waiting for a real failure.
#
# KNOWN LIMIT. GitHub switches a schedule off after 60 days without repository activity in a public
# repository. That disables this file silently; the tracking issue cannot report a run that never
# happens.

on:
  schedule:
    # 02:17 UTC every night. Off the hour, where GitHub's scheduler is busiest and drops runs.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force_red:
        description: Skip the shards and take the red path (tracking issue, failed run) to prove it works
        type: boolean
        default: false

# Read-only by default. Only the `report` job asks for more.
permissions:
  contents: read

concurrency:
  # Never two of these at once on one ref. Queue rather than cancel: a run cancelled at hour two
  # has measured nothing anybody can read.
  group: mcp-mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Needs no `npm ci`: the planner imports `stryker.config.mjs` (whose only import is `node:os`)
  # and walks the scope with `node:fs`.
  plan:
    name: Plan the shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Split the MCP mutation scope
        id: plan
        run: |
          set -euo pipefail
          npm run --silent test:mutation:mcp:plan
          matrix="$(npm run --silent test:mutation:mcp:plan -- --matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mutants:
    name: Mutants ${{ matrix.shard }}
    needs: plan
    # A forced red run measures nothing, so it spends no runner-hours on shards. `inputs` is empty
    # on a scheduled run, so the schedule always measures.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_red) }}
    runs-on: ubuntu-latest
    # Five hours, under GitHub's 6-hour hard kill. A ceiling, not a target: the heaviest shard in
    # the measured-cost split (#443) is estimated at roughly 3 hours, so a shard that reaches this
    # ceiling is a regression worth failing on — and it fails loudly, because its missing report
    # fails the aggregate below.
    timeout-minutes: 300
    strategy:
      # Every shard runs. Stopping the others on one failure would leave the aggregate unable to
      # say whether the whole scope is above the floor, which is the only question asked here.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The file list goes through the environment, never interpolated into the command line.
      # `${{ }}` inside `run:` is textual substitution, and a path is repository content.
      - name: Run Stryker over this slice
        env:
          SHARD_MUTATE: ${{ matrix.mutate }}
        run: npm run test:mutation:mcp:shard -- --mutate "$SHARD_MUTATE"

      # `always()`: a shard that crashed after writing a partial report still tells the aggregate
      # something, and a shard that wrote nothing must reach the aggregate as a MISSING report
      # rather than as a job somebody has to remember to look at.
      - name: Upload this shard's report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ matrix.shard }}
          path: .local/mutation/mcp/
          # LOAD-BEARING. Stryker writes its reports under `.local/`, and this action skips every
          # path inside a dot-directory unless told not to. Without this line the artifact uploads
          # empty and the aggregate reports every shard missing.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Score and report
    needs: [plan, mutants]
    # `!cancelled()` rather than a success condition: a failed or timed-out shard, and a failed
    # planner, must still land here. The aggregate treats a missing report as a failure, and a
    # planner failure is written up as one, so neither becomes a quietly smaller measurement.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Allowed to fail: a shard that uploaded nothing is reported by the aggregate, by number,
      # which says more than a download error would.
      - name: Download every shard's report
        if: needs.plan.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-report-*
          path: .local/mutation/shards

      # Always writes a summary and a verdict, so the steps below have something to act on. No
      # `set -e`: the aggregate's own exit status IS the verdict, and must not end the step early.
      - name: Sum the shards and apply the floor
        id: aggregate
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          FORCE_RED: ${{ github.event_name == 'workflow_dispatch' && inputs.force_red }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          mkdir -p .local/mutation
          rm -f .local/mutation/summary.md
          verdict=red
          # shellcheck disable=SC2016 # the backticks in single quotes are Markdown, not expansions
          if [ "$FORCE_RED" = "true" ]; then
            printf '## MCP mutation gate — FAILED (forced)\n\nDispatched with `force_red: true`: no shard ran, and this run is red on purpose, to prove the red path reaches this issue. It says nothing about the mutation score.\n\n[The run](%s)\n' \
              "$RUN_URL" > .local/mutation/summary.md
          elif [ "$PLAN_RESULT" != "success" ]; then
            printf '## MCP mutation gate — FAILED\n\nThe `plan` job ended `%s`, so no shard ran and nothing was measured.\n\n[The run](%s)\n' \
              "$PLAN_RESULT" "$RUN_URL" > .local/mutation/summary.md
          elif npm run --silent test:mutation:mcp:report -- --reports .local/mutation/shards --out .local/mutation/summary.md; then
            verdict=green
          fi
          if [ ! -s .local/mutation/summary.md ]; then
            printf '## MCP mutation gate — FAILED\n\nThe aggregate did not produce a report. See the step log.\n\n[The run](%s)\n' \
              "$RUN_URL" > .local/mutation/summary.md
          fi
          cat .local/mutation/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      # Reads only. Absent on the first run after the starting list, and whenever the newest list
      # has expired: the grouping then says it could not compare, rather than calling nothing seen.
      - name: Find the previous main run's survivor list
        if: ${{ needs.plan.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.force_red) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run --silent test:mutation:mcp:survivors -- previous --out .local/mutation/previous

      # Never changes the verdict: the floor alone decides red or green. A grouping that fails is
      # written into the summary and reaches the tracking issue as `new=unknown`. Allowed to fail,
      # like every step between the aggregate and the issue step: the issue step's `if` carries an
      # implicit `success()`, and a failure here must not stop a red night from filing the issue.
      - name: Group the survivors into new, already seen and known
        id: survivors
        if: ${{ needs.plan.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.force_red) }}
        continue-on-error: true
        run: |
          set -u
          if ! npm run --silent test:mutation:mcp:survivors -- group --reports .local/mutation/shards \
              --previous .local/mutation/previous/survivors.json --out-md .local/mutation/summary.md \
              --out-json .local/mutation/survivors.json --outputs "$GITHUB_OUTPUT" > .local/mutation/survivors.md; then
            printf '\n### Survivors: new, already seen, known\n\nThe grouping failed, so new survivors could not be told apart. See the step log.\n' | tee -a .local/mutation/summary.md > .local/mutation/survivors.md
            echo "new=unknown" >> "$GITHUB_OUTPUT"
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
          cat .local/mutation/survivors.md >> "$GITHUB_STEP_SUMMARY"

      # Only a run where every shard reported uploads its list, so "the previous run" is always a
      # complete one and a missing shard's survivors are not forgotten the night after.
      # Allowed to fail: a lost list only means the next night compares with an older one, or says
      # it could not compare. Failing here would skip the tracking-issue step below.
      - name: Upload this run's survivor list
        if: ${{ steps.survivors.outputs.complete == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-survivors
          path: .local/mutation/survivors.json
          include-hidden-files: true
          # A re-run of this job uploads under the same name; without this the upload fails the job.
          overwrite: true
          if-no-files-found: error
          retention-days: 90

      # `main` only: a dispatch on a feature branch measures that branch, and must not comment on,
      # reopen or close the issue that tracks `main`. The script refuses other refs as well.
      - name: File, update or close the tracking issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.aggregate.outputs.verdict }}
          NEW_SURVIVORS: ${{ steps.survivors.outputs.new }}
        run: npm run --silent test:mutation:mcp:issue -- --verdict "$VERDICT" --summary .local/mutation/summary.md --run-id "$GITHUB_RUN_ID" --new-survivors "$NEW_SURVIVORS"

      # The last word on the job's own status, so a red night is a RED scheduled check and not just
      # an issue somebody may or may not see. Anything but an explicit green fails.
      - name: Fail the gate unless the whole scope cleared its floor
        if: ${{ !cancelled() && steps.aggregate.outputs.verdict != 'green' }}
        run: |
          echo "::error title=MCP mutation gate::the whole-scope mutation score did not clear the floor in packages/xezar/stryker.config.mjs, or a shard or the planner failed — see the run summary"
          exit 1
