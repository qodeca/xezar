# Dependency update pull requests. They target `develop`, the base branch every change lands on
# (`main` takes release-class PRs only, see .github/workflows/pr-source-guard.yml). Minor and patch
# updates arrive grouped, one PR per ecosystem per week; a major update gets a PR of its own,
# because it is the one that needs a person to read its changelog. `cooldown` waits a week after a
# release before proposing it, so a version pulled soon after publication never reaches a PR.
version: 2
updates:
  # The root manifest and lockfile cover all four workspaces.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The default cap is 5 open PRs. With the weekly group and a few majors waiting for review, the
    # cap fills up and every further major (the ones that most need a person) is never proposed.
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    # `@types/node` follows the oldest Node major the packages support (`engines.node`), not the
    # newest: types from a later major let code call APIs the supported floor lacks. Move its major
    # by hand, together with `engines.node`.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Workflow actions are pinned by commit SHA with a version comment; Dependabot keeps both in step.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
