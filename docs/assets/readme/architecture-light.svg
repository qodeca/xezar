<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" style="font-family: ui-sans-serif, system-ui, sans-serif">
<title id="title">How xezar works</title>
<desc id="desc">The browser sends tasks to the local service and receives events. The service drives agent CLIs, which edit git worktrees. Branches and pull requests reach GitHub via gh. A Claude Code leader attaches to the service over MCP and receives pushed events.</desc>
