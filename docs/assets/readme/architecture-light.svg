<text x="470" y="224" font-size="22" font-weight="400" fill="#5c5c5c">.local/xezar/</text>
<rect x="868" y="118" width="292" height="142" rx="12" fill="#ffffff" stroke="#ebebeb"/>
<text x="890" y="156" font-size="28" font-weight="600" fill="#171717">Agent CLIs</text>
<text x="890" y="194" font-size="22" font-weight="400" fill="#5c5c5c">Claude Code · Codex · pi</text>
<text x="890" y="224" font-size="22" font-weight="400" fill="#5c5c5c">OpenCode experimental</text>
