<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc" style="font-family: ui-sans-serif, system-ui, sans-serif">
<title id="title">The task lifecycle</title>
<desc id="desc">Queued to running to done, with an optional review gate off by default. Running can wait and resume or fail. Worktree creation happens at start; workflow gates are configured checks. A PR and a human merge follow separately; xezar never auto-merges.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a3a3a3" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1200" height="360" rx="0" fill="#0d0d0d" stroke="#0d0d0d"/>
<text x="40" y="46" font-size="30" font-weight="600" fill="#ffffff">A task’s life</text>
<rect x="40" y="82" width="196" height="62" rx="12" fill="#171717" stroke="#262626"/>
<circle cx="62" cy="113" r="5" fill="#7b7b7b"/>
<text x="80" y="122" font-size="28" font-weight="600" fill="#ffffff">Queued</text>
