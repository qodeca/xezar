<circle cx="314" cy="113" r="5" fill="#8f86e8"/>
<text x="332" y="122" font-size="28" font-weight="600" fill="#ffffff">Running</text>
<rect x="544" y="82" width="196" height="62" rx="12" fill="#171717" stroke="#262626"/>
<circle cx="566" cy="113" r="5" fill="#8f86e8"/>
<text x="584" y="122" font-size="28" font-weight="600" fill="#ffffff">Review</text>
<rect x="796" y="82" width="196" height="62" rx="12" fill="#171717" stroke="#262626"/>
<circle cx="818" cy="113" r="5" fill="#10b981"/>
<text x="836" y="122" font-size="28" font-weight="600" fill="#ffffff">Done</text>
<path d="M236 113h56" fill="none" stroke="#a3a3a3" stroke-width="2"/>
<path d="M284 107l8 6-8 6" fill="none" stroke="#a3a3a3" stroke-width="2"/>
<path d="M488 113h56" fill="none" stroke="#a3a3a3" stroke-width="2"/>
<path d="M536 107l8 6-8 6" fill="none" stroke="#a3a3a3" stroke-width="2"/>
