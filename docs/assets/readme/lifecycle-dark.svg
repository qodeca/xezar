<rect x="486" y="190" width="166" height="54" rx="12" fill="#171717" stroke="#262626"/>
<circle cx="509" cy="217" r="5" fill="#ef4444"/>
<text x="526" y="226" font-size="26" font-weight="400" fill="#ffffff">Failed</text>
