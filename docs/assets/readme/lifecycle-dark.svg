<path d="M390 82V64H894V82" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-dasharray="6 6"/>
<text x="593" y="56" font-size="24" font-weight="400" fill="#a3a3a3">Default path</text>
<text x="546" y="176" font-size="22" font-weight="400" fill="#a3a3a3">Optional · off by default</text>
<path d="M354 144V217H210" fill="none" stroke="#a3a3a3" stroke-width="2" marker-start="url(#back)" marker-end="url(#arrow)"/>
<rect x="40" y="188" width="170" height="54" rx="12" fill="#171717" stroke="#262626"/>
<circle cx="62" cy="217" r="5" fill="#fbbf24"/>
<text x="80" y="224" font-size="26" font-weight="400" fill="#ffffff">Waiting</text>
